services:
  redis:
    image: redis:7-alpine
    container_name: genshin-redis
    ports:
      - "6379:6379"
    # Persist data across restarts so cached answers survive
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    restart: unless-stopped

volumes:
  redis_data:
